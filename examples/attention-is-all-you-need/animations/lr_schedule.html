<title>The warmup learning-rate schedule · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "The warmup learning-rate schedule",
  source: "Attention Is All You Need · §5.3, Eq. (3)",
  equation: String.raw`lrate = d_{model}^{-0.5}\cdot\min\!\left({\color{#83c167}step^{-0.5}},\ {\color{#58c4dd}step\cdot warmup^{-1.5}}\right)`,
  notes: [
    "Adam's base learning rate is 1.0, so this curve is the actual learning rate.",
    "After warmup, the rate depends only on $d_{model}$ and the step, not on warmup_steps.",
    "Doubling warmup_steps lowers the peak by a factor of √2 and moves it later.",
  ],
};

const PARAMS = [
  { id: "warmup", label: "warmup_steps", min: 500, max: 16000, step: 500, value: 4000, paperValue: 4000, help: "Length of the linear ramp. Paper: 4000." },
  { id: "logd", label: "log₂ d_model", min: 7, max: 10, step: 1, value: 9, paperValue: 9, help: "d_model = 2^value (128 to 1024). Paper base model: 512." },
];

const STEPS = [
  { caption: "Eq. (3) has two branches. The first, ${\\color{#58c4dd}step \\cdot warmup^{-1.5}}$, is a straight line: the warmup ramp.", duration: 3 },
  { caption: "The second, ${\\color{#83c167}step^{-0.5}}$, starts high and decays like one over the square root of the step.", duration: 3 },
  { caption: "The learning rate is the smaller of the two: ramp up, peak where they cross at $step = warmup$, then decay.", duration: 3.5 },
  { caption: "Drag warmup_steps and $d_{model}$. The dashed curve is the paper's base setting (512, 4000). A larger $d_{model}$ lowers the whole curve.", duration: 3 },
  { caption: "Zoom into the start. Warmup is a small slice of training (4,000 of 100,000 steps), but without it post-LN Transformers often diverge.", duration: 3.5 },
];

function draw({ S, C, step, p, params, lerp, during, fmt }) {
  const d = 2 ** params.logd, W = params.warmup;
  const lr = (s, dd, ww) => Math.pow(dd, -0.5) * Math.min(Math.pow(s, -0.5), s * Math.pow(ww, -1.5));
  const ramp = s => Math.pow(d, -0.5) * s * Math.pow(W, -1.5);
  const decay = s => Math.pow(d, -0.5) * Math.pow(s, -0.5);
  const peak = lr(W, d, W), paperPeak = lr(4000, 512, 4000);

  const X0 = 100, X1 = 750, Y0 = 75, Y1 = 350;
  const xmax = step === 4 ? lerp(100000, 12000, p) : 100000;
  const ymax = 1.35 * Math.max(peak, paperPeak);
  const sx = s => X0 + (s / xmax) * (X1 - X0);
  const sy = v => Y1 - (v / ymax) * (Y1 - Y0);

  // Axes
  S.line(X0, Y1, X1, Y1, { stroke: C.dim, width: 1 });
  S.line(X0, Y0, X0, Y1, { stroke: C.dim, width: 1 });
  const ticks = xmax > 40000 ? [0, 25000, 50000, 75000, 100000] : [0, 4000, 8000, 12000, 16000];
  ticks.filter(t => t <= xmax).forEach(t => S.text(sx(t), Y1 + 20, t === 0 ? "0" : t / 1000 + "k", { size: 12, fill: C.dim, anchor: "middle" }));
  [0.25, 0.5, 0.75].forEach(f => {
    S.line(X0 - 4, sy(ymax * f), X0, sy(ymax * f), { stroke: C.dim, width: 1 });
    S.text(X0 - 8, sy(ymax * f) + 4, (ymax * f).toExponential(1), { size: 11, fill: C.dim, anchor: "end" });
  });
  S.text((X0 + X1) / 2, Y1 + 42, "training step", { size: 13, fill: C.dim, anchor: "middle" });
  S.text(X0, 55, "learning rate · d_model = " + d + " · warmup_steps = " + W, { size: 14, fill: C.dim });

  // A curve sampled up to `frac` of the visible range, dropping points above the chart.
  const curve = (f, frac) => {
    const pts = [];
    const N = 300;
    for (let q = 0; q <= N * frac; q++) {
      const s = Math.max(1, (q / N) * xmax), v = f(s);
      if (v <= ymax) pts.push([sx(s), sy(v)]);
    }
    return pts;
  };
  const draw_ = (pts, o) => { if (pts.length > 1) S.polyline(pts, o); };

  const r0 = step === 0 ? during(p, 0, 0.9) : 1;
  const r1 = step < 1 ? 0 : step === 1 ? during(p, 0, 0.9) : 1;
  const r2 = step < 2 ? 0 : step === 2 ? during(p, 0.1, 0.9) : 1;
  const faint = step >= 2 ? 0.35 : 0.95;
  if (r0 > 0) draw_(curve(ramp, r0), { stroke: C.blue, width: 2.5, opacity: faint });
  if (r1 > 0) draw_(curve(decay, r1), { stroke: C.green, width: 2.5, opacity: faint });
  if (step >= 3) draw_(curve(s => lr(s, 512, 4000), 1), { stroke: C.dim, width: 1.5, dash: "6 5" });
  if (r2 > 0) draw_(curve(s => lr(s, d, W), r2), { stroke: C.yellow, width: 4 });

  if ((step > 2 || (step === 2 && p > 0.5)) && W <= xmax) {
    const right = sx(W) > 560;
    S.line(sx(W), sy(peak), sx(W), Y1, { stroke: C.yellow, width: 1, dash: "3 4" });
    S.circle(sx(W), sy(peak), 6, { fill: C.yellow });
    S.text(sx(W) + (right ? -10 : 10), sy(peak) - 12, "peak " + fmt(peak) + " at step " + W, { size: 13, fill: C.yellow, anchor: right ? "end" : "start" });
  }
  if (step >= 3) {
    S.text(X1, 425, "lr at step 100k: " + fmt(lr(100000, d, W)) + "   ·   paper setting: " + fmt(lr(100000, 512, 4000)) + "   ·   paper peak: " + fmt(paperPeak),
      { size: 13, fill: C.dim, anchor: "end" });
  }
}
</script>
<script defer src="_player.js"></script>
</body>
