<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  researcher-pal animation template.
  Copy to papers/<slug>/animations/<concept-id>.html and edit ONLY the block between
  "EDIT BELOW" and "EDIT ABOVE" (plus the <title>). The player below it (timeline,
  controls, scrubbing, keyboard, KaTeX) is shared.

<title>Scaled dot-product attention, step by step · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "Scaled dot-product attention, step by step",
  source: "Attention Is All You Need · §3.2.1, Eq. (1) · masking from §3.2.3",
  equation: String.raw`\mathrm{Attention}(Q,K,V) = \mathrm{softmax}\!\left(\frac{{\color{#f4d35e}Q}{\color{#58c4dd}K}^\top}{\sqrt{d_k}}\right){\color{#83c167}V}`,
  notes: [
    "The softmax runs along each row (over the keys), never down a column.",
    "Masking happens before the softmax, so the remaining weights still sum to 1.",
    "Rotating one query changes only its own row: queries don't interact inside one attention call.",
  ],
};

const PARAMS = [
  { id: "token", label: "Highlighted token", min: 1, max: 4, step: 1, value: 2, help: "1 = I, 2 = love, 3 = green, 4 = tea." },
  { id: "turn", label: "Rotate its query (degrees)", min: -180, max: 180, step: 5, value: 0, help: "Only this token's query changes." },
  { id: "mask", label: "Causal mask (§3.2.3)", min: 0, max: 1, step: 1, value: 0, paperValue: 1, help: "0 = encoder self-attention, 1 = decoder self-attention." },
];

const STEPS = [
  { caption: "Four tokens. Each has a query ${\\color{#f4d35e}q}$ (what it looks for) and a key ${\\color{#58c4dd}k}$ (what it offers). They are 2-D here so we can draw them; the paper uses $d_k = 64$.", duration: 3.5 },
  { caption: "Score every query against every key in one matrix multiply: entry $(i, j)$ of $QK^\\top$ is $q_i \\cdot k_j$. Arrows pointing the same way score high.", duration: 3.5 },
  { caption: "Divide every score by $\\sqrt{d_k}$ (here $\\sqrt{2}$), so scores don't grow with the dimension. The next animation shows why.", duration: 3 },
  { caption: "Decoder self-attention only: a causal mask sets scores for later tokens to $-\\infty$ before the softmax. Turn it on with the mask slider.", duration: 3 },
  { caption: "Softmax each row. Every query's weights are now positive and sum to 1, and masked entries become exactly 0.", duration: 3.5 },
  { caption: "The highlighted token's output is its weighted blend of the values, $\\sum_j w_j {\\color{#83c167}v_j}$. Rotate its query and watch the blend move.", duration: 4.5 },
];

function draw({ S, C, step, p, params, lerp, during, fmt }) {
  const tokens = ["I", "love", "green", "tea"];
  const K = [[1.6, 0.4], [0.3, 1.7], [-1.2, 0.9], [-0.5, -1.4]];
  const V = [[1.2, 0.3], [0.2, 1.2], [-1.1, 0.5], [-0.4, -1.1]];
  const Q0 = [[1.3, 0.8], [0.1, 1.6], [-1.5, 0.4], [0.7, -1.2]];
  const n = 4, dk = 2, sel = params.token - 1, mask = params.mask === 1;
  const a = (params.turn * Math.PI) / 180;
  const Q = Q0.map((q, i) => (i !== sel ? q : [q[0] * Math.cos(a) - q[1] * Math.sin(a), q[0] * Math.sin(a) + q[1] * Math.cos(a)]));

  // The real computation, Eq. (1) with optional causal mask.
  const raw = Q.map(q => K.map(k => q[0] * k[0] + q[1] * k[1]));
  const scaled = raw.map(row => row.map(v => v / Math.sqrt(dk)));
  const masked = scaled.map((row, i) => row.map((v, j) => (mask && j > i ? -Infinity : v)));
  const W = masked.map(row => {
    const top = Math.max(...row);
    const e = row.map(v => (Number.isFinite(v) ? Math.exp(v - top) : 0));
    const total = e.reduce((s, x) => s + x, 0);
    return e.map(x => x / total);
  });

  const U = 50;
  const L = [150, 240], R = [670, 240];
  const at = (o, v) => [o[0] + v[0] * U, o[1] - v[1] * U];
  const axes = (o, title) => {
    S.line(o[0] - 110, o[1], o[0] + 110, o[1], { stroke: C.line, width: 1 });
    S.line(o[0], o[1] - 110, o[0], o[1] + 110, { stroke: C.line, width: 1 });
    S.text(o[0], 52, title, { size: 15, fill: C.dim, anchor: "middle" });
  };

  // ---- Left: keys and the highlighted query
  axes(L, "queries and keys");
  const keyIn = step === 0 ? during(p, 0, 0.5) : 1;
  K.forEach((k, j) => {
    const tip = at(L, k);
    if (step >= 4) {
      const qt = at(L, Q[sel]);
      const w = W[sel][j] * (step === 4 ? p : 1);
      S.line(qt[0], qt[1], tip[0], tip[1], { stroke: C.yellow, width: 1 + 7 * w, opacity: 0.12 + 0.6 * w, dash: "4 4" });
    }
    S.arrow(L[0], L[1], tip[0], tip[1], { stroke: C.blue, width: 2.5, opacity: keyIn });
    S.text(tip[0] + (k[0] >= 0 ? 6 : -6), tip[1] + (k[1] >= 0 ? -6 : 16), "k " + tokens[j],
      { size: 13, fill: C.blue, anchor: k[0] >= 0 ? "start" : "end", opacity: keyIn });
  });
  const qIn = step === 0 ? during(p, 0.4, 1) : 1;
  if (qIn > 0.05) {
    const qt = at(L, [Q[sel][0] * qIn, Q[sel][1] * qIn]);
    S.arrow(L[0], L[1], qt[0], qt[1], { stroke: C.yellow, width: 3.5 });
    S.text(qt[0] + 6, qt[1] - 8, "q " + tokens[sel], { size: 14, fill: C.yellow, weight: 600 });
  }

  // ---- Middle: the score / weight matrix
  const cell = 40, mx = 330, my = 130;
  const titles = ["score matrix", "scores  q · k", "scores / √d_k", mask ? "mask the future" : "mask (off)", "softmax each row", "attention weights"];
  S.text(mx + (n * cell) / 2, 52, titles[step], { size: 15, fill: C.dim, anchor: "middle" });
  const maxAbs = Math.max(...raw.flat().map(Math.abs)) || 1;
  const scoreText = v => (Number.isFinite(v) ? v.toFixed(2) : "−∞");
  for (let i = 0; i < n; i++) {
    S.text(mx - 8, my + i * cell + cell / 2 + 3, "q " + tokens[i], { size: 12, anchor: "end", fill: i === sel ? C.yellow : C.dim });
    for (let j = 0; j < n; j++) {
      if (i === 0) S.text(mx + j * cell + (cell - 4) / 2, my - 8, "k " + tokens[j], { size: 11, anchor: "middle", fill: C.blue });
      const x = mx + j * cell, y = my + i * cell, w = cell - 4;
      S.rect(x, y, w, w, { fill: "#15181d", rx: 4 });
      if (step === 0 || (step === 1 && i * n + j >= p * n * n)) continue;
      let v = raw[i][j];
      if (step === 2) v = lerp(raw[i][j], scaled[i][j], p);
      if (step === 3) v = mask && j > i && p > 0.35 ? -Infinity : scaled[i][j];
      if (step >= 4) v = masked[i][j];
      const t = step === 4 ? p : step === 5 ? 1 : 0; // 0 = show scores, 1 = show weights
      if (Number.isFinite(v)) {
        S.rect(x, y, w, w, { fill: v >= 0 ? C.blue : C.red, opacity: (1 - t) * (0.15 + 0.7 * Math.min(1, Math.abs(v) / maxAbs)), rx: 4 });
      } else {
        S.rect(x, y, w, w, { fill: "#3a3f47", opacity: 1 - t, rx: 4 });
      }
      S.rect(x, y, w, w, { fill: C.yellow, opacity: t * (0.06 + 0.85 * W[i][j]), rx: 4 });
      S.text(x + w / 2, y + w / 2 + 4, t < 0.5 ? scoreText(v) : W[i][j].toFixed(2),
        { size: 11, anchor: "middle", fill: t >= 0.5 && W[i][j] > 0.55 ? "#111111" : C.ink });
    }
    if (step >= 4) {
      S.text(mx + n * cell + 4, my + i * cell + cell / 2 + 3, "Σ = " + W[i].reduce((s, x) => s + x, 0).toFixed(2),
        { size: 11, fill: C.dim, opacity: step === 4 ? during(p, 0.6, 1) : 1 });
    }
  }
  S.rect(mx - 3, my + sel * cell - 3, n * cell + 2, cell + 2, { stroke: C.yellow, width: 2, rx: 6 });

  // ---- Right: values and the output blend
  axes(R, step === 5 ? "output = Σ w · v" : "values");
  V.forEach((v, j) => {
    const tip = at(R, v);
    S.arrow(R[0], R[1], tip[0], tip[1], { stroke: C.green, width: 2.5, opacity: step === 5 ? 0.3 + 0.6 * W[sel][j] : 0.6 });
    S.text(tip[0] + (v[0] >= 0 ? 6 : -6), tip[1] + (v[1] >= 0 ? -6 : 16), "v " + tokens[j],
      { size: 13, fill: C.green, anchor: v[0] >= 0 ? "start" : "end", opacity: 0.85 });
  });
  if (step === 5) {
    let acc = [0, 0];
    W[sel].forEach((w, j) => {
      const t = during(p, j * 0.18, (j + 1) * 0.18);
      if (t <= 0 || w < 0.01) return;
      const next = [acc[0] + w * V[j][0] * t, acc[1] + w * V[j][1] * t];
      const s0 = at(R, acc), s1 = at(R, next);
      if (Math.hypot(s1[0] - s0[0], s1[1] - s0[1]) > 3) S.arrow(s0[0], s0[1], s1[0], s1[1], { stroke: C.orange, width: 2, head: 7 });
      acc = next;
    });
    const out = V.reduce((s, v, j) => [s[0] + W[sel][j] * v[0], s[1] + W[sel][j] * v[1]], [0, 0]);
    const o = during(p, 0.75, 1);
    if (o > 0) {
      const tip = at(R, out);
      S.arrow(R[0], R[1], tip[0], tip[1], { stroke: C.red, width: 4, opacity: o });
      S.text(R[0], R[1] + 150, "red arrow = output for “" + tokens[sel] + "”", { size: 13, fill: C.red, anchor: "middle", opacity: o });
    }
  }

  if (step >= 4) {
    S.text(400, 425, "weights for “" + tokens[sel] + "”:  " + W[sel].map((w, j) => tokens[j] + " " + fmt(w)).join("   "),
      { size: 14, fill: C.yellow, anchor: "middle" });
  }
}
</script>
<script defer src="_player.js"></script>
</body>
</html>
