<title>Why divide by √d_k? · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "Why divide by √d_k?",
  source: "Attention Is All You Need · §3.2.1, last paragraph and footnote 4",
  equation: String.raw`\mathrm{Var}[q \cdot k] = \sum_{i=1}^{d_k} \mathrm{Var}[q_i k_i] = d_k \;\;\Rightarrow\;\; \mathrm{Var}\!\left[\frac{q \cdot k}{\sqrt{d_k}}\right] = 1`,
  notes: [
    "The paper says \"we suspect\": this is a hypothesis backed by one experiment [3], not a proof.",
    "Real queries and keys are learned, not random. What matters is how the spread grows with $d_k$.",
    "Try $d_k = 1$: scaling barely matters. Try 512: without it the weights are essentially one-hot.",
  ],
};

const PARAMS = [
  { id: "logdk", label: "log₂ d_k", min: 0, max: 9, step: 1, value: 6, paperValue: 6,
    help: "d_k = 2^value, from 1 to 512. The paper uses d_k = 64 (value 6)." },
];

const STEPS = [
  { caption: "Draw a random query $q$ and key $k$ whose $d_k$ components have mean 0 and variance 1, the assumption in footnote 4.", duration: 3.5 },
  { caption: "Their dot product adds up $d_k$ independent terms, so its variance is $d_k$ and its spread grows like $\\sqrt{d_k}$. Slide $d_k$ and watch the histogram widen.", duration: 4 },
  { caption: "Score one query against 8 keys and apply the softmax. With scores this spread out, most of the weight usually lands on a single key.", duration: 3.5 },
  { caption: "Divide the scores by $\\sqrt{d_k}$. The axis zooms in 10×: the spread is back to about 1 at every dimension, and the weights stay spread out.", duration: 4 },
  { caption: "Why it matters for learning: the softmax gradient $s_i(\\delta_{ij} - s_j)$ vanishes when one weight is near 1. Unscaled, gradients shrink as $d_k$ grows; scaled, they hold steady.", duration: 4.5 },
];

const DK_CACHE = {};
// Seeded simulation for one d_k: 600 random dot products, plus 100 "one query vs 8 keys" rows.
function dkStats(dk) {
  if (DK_CACHE[dk]) return DK_CACHE[dk];
  let seed = 7 + dk * 131;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const gauss = () => { let u = 0; while (u === 0) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
  const vec = () => Array.from({ length: dk }, gauss);
  const dot = (x, y) => x.reduce((s, xi, i) => s + xi * y[i], 0);
  const softmax = z => { const m = Math.max(...z); const e = z.map(v => Math.exp(v - m)); const t = e.reduce((s, x) => s + x, 0); return e.map(x => x / t); };
  const jacobianNorm = s => { let f = 0; s.forEach((si, i) => s.forEach((sj, j) => { const v = (i === j ? si : 0) - si * sj; f += v * v; })); return Math.sqrt(f); };
  const mean = xs => xs.reduce((s, x) => s + x, 0) / xs.length;

  const dots = [];
  for (let s = 0; s < 600; s++) dots.push(dot(vec(), vec()));
  const rows = [];
  for (let s = 0; s < 100; s++) { const q = vec(); rows.push(Array.from({ length: 8 }, () => dot(q, vec()))); }
  const maxU = rows.map(z => Math.max(...softmax(z)));
  const maxS = rows.map(z => Math.max(...softmax(z.map(v => v / Math.sqrt(dk)))));
  const meanMaxU = mean(maxU);
  // Show a typical row: the one whose largest unscaled weight is closest to the average.
  let pick = 0;
  maxU.forEach((v, i) => { if (Math.abs(v - meanMaxU) < Math.abs(maxU[pick] - meanMaxU)) pick = i; });
  const example = rows[pick];
  return (DK_CACHE[dk] = {
    dots,
    std: Math.sqrt(mean(dots.map(d => d * d))),
    q: Array.from({ length: Math.min(dk, 32) }, gauss),
    k: Array.from({ length: Math.min(dk, 32) }, gauss),
    softU: softmax(example),
    softS: softmax(example.map(v => v / Math.sqrt(dk))),
    meanMaxU,
    meanMaxS: mean(maxS),
    gradU: mean(rows.map(z => jacobianNorm(softmax(z)))),
    gradS: mean(rows.map(z => jacobianNorm(softmax(z.map(v => v / Math.sqrt(dk)))))),
  });
}

function draw({ S, C, step, p, params, lerp, during, fmt }) {
  const dk = 2 ** params.logdk, sq = Math.sqrt(dk);
  const st = dkStats(dk);
  const LX = 50, LW = 330, LY = 90, LH = 220;
  const RX = 440, RW = 320, RY = 90, RH = 220;

  // ---- Step 0: the components of q and k
  if (step === 0) {
    const g = S.group({ opacity: during(p, 0, 0.3) });
    S.text(LX, 80, "q and k: the first " + Math.min(dk, 32) + " of d_k = " + dk + " components (blue > 0, red < 0)", { size: 14, fill: C.dim, parent: g });
    [["q", st.q, C.yellow, 130], ["k", st.k, C.blue, 190]].forEach(([name, vals, color, y]) => {
      S.text(LX, y + 15, name, { size: 20, fill: color, weight: 600, parent: g });
      vals.forEach((v, i) => {
        const shown = during(p, 0.1 + (i / 32) * 0.55, 0.2 + (i / 32) * 0.55);
        S.rect(LX + 26 + i * 22, y, 19, 19, { fill: v >= 0 ? C.blue : C.red, opacity: shown * Math.min(1, 0.2 + Math.abs(v) / 2), rx: 3, parent: g });
      });
    });
    S.text(LX, 275, "q · k = q₁k₁ + q₂k₂ + … (d_k terms, each with mean 0 and variance 1)", { size: 18, parent: g, opacity: during(p, 0.65, 1) });
  }

  // ---- Left panel, steps 1–4: histogram of dot products (the axis zooms in as the values shrink)
  if (step >= 1) {
    const opacity = step === 1 ? during(p, 0, 0.3) : step === 4 ? 1 - p : 1;
    const g = S.group({ opacity });
    const t = step === 3 ? p : step === 4 ? 1 : 0;
    const XR = lerp(50, 5, t);
    const hx = v => LX + ((v + XR) / (2 * XR)) * LW;
    const values = st.dots.map(d => lerp(d, d / sq, t));
    const bins = new Array(50).fill(0);
    values.forEach(v => { const b = Math.floor(((v + XR) / (2 * XR)) * 50); if (b >= 0 && b < 50) bins[b]++; });
    const top = Math.max(...bins) || 1, bw = LW / 50;
    S.text(LX + LW / 2, 70, t < 0.5 ? "q · k for 600 random pairs" : "q · k / √d_k for the same pairs", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    bins.forEach((c, b) => S.rect(LX + b * bw + 0.5, LY + LH - (c / top) * LH, bw - 1, (c / top) * LH, { fill: C.blue, opacity: 0.85, parent: g }));
    S.line(LX, LY + LH, LX + LW, LY + LH, { stroke: C.dim, width: 1, parent: g });
    [-0.8, -0.4, 0, 0.4, 0.8].forEach(f => {
      const v = f * XR;
      S.text(hx(v), LY + LH + 18, Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1), { size: 12, fill: C.dim, anchor: "middle", parent: g });
    });
    const m = lerp(sq, 1, t);
    if (m < XR) {
      [-m, m].forEach(v => S.line(hx(v), LY, hx(v), LY + LH, { stroke: C.yellow, width: 1.5, dash: "4 4", parent: g }));
      S.text(hx(m) + 4, LY + 12, t < 0.5 ? "±√d_k" : "±1", { size: 12, fill: C.yellow, parent: g });
    }
    const measured = t < 0.5 ? st.std : st.std / sq;
    S.text(LX, LY + LH + 48, "spread (std): expected " + (t < 0.5 ? fmt(sq) : "1.00") + ", measured " + fmt(measured), { size: 13, fill: C.ink, parent: g });
  }

  // ---- Left panel, step 4: gradient size vs d_k
  if (step === 4) {
    const g = S.group({ opacity: p });
    const all = Array.from({ length: 10 }, (_, e) => dkStats(2 ** e));
    const top = Math.max(...all.map(s => Math.max(s.gradU, s.gradS))) * 1.15;
    const cx = e => LX + (e / 9) * LW, cy = v => LY + LH - (v / top) * LH;
    S.text(LX + LW / 2, 70, "average softmax gradient size vs d_k", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    S.line(LX, LY + LH, LX + LW, LY + LH, { stroke: C.dim, width: 1, parent: g });
    [0, 3, 6, 9].forEach(e => S.text(cx(e), LY + LH + 18, "d_k=" + 2 ** e, { size: 12, fill: C.dim, anchor: "middle", parent: g }));
    S.polyline(all.map((s, e) => [cx(e), cy(s.gradU)]), { stroke: C.red, width: 3, parent: g });
    S.polyline(all.map((s, e) => [cx(e), cy(s.gradS)]), { stroke: C.green, width: 3, parent: g });
    S.line(cx(params.logdk), LY, cx(params.logdk), LY + LH, { stroke: C.yellow, width: 1.5, dash: "4 4", parent: g });
    S.text(LX + LW, cy(all[9].gradS) - 10, "scaled", { size: 13, fill: C.green, anchor: "end", parent: g });
    S.text(LX + LW, cy(all[9].gradU) - 10, "unscaled", { size: 13, fill: C.red, anchor: "end", parent: g });
    S.text(LX, LY + LH + 48, "at d_k = " + dk + ": unscaled " + fmt(st.gradU, 3) + " vs scaled " + fmt(st.gradS, 3), { size: 13, fill: C.ink, parent: g });
  }

  // ---- Right panel, steps 2–4: softmax over 8 keys for a typical query
  if (step >= 2) {
    const g = S.group({ opacity: step === 2 ? during(p, 0, 0.3) : 1 });
    const t = step === 2 ? 0 : step === 3 ? p : 1;
    const grow = step === 2 ? during(p, 0.2, 1) : 1;
    S.text(RX + RW / 2, 70, t < 0.5 ? "softmax(scores): a typical query, 8 keys" : "softmax(scores / √d_k)", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    S.line(RX, RY + RH, RX + RW, RY + RH, { stroke: C.dim, width: 1, parent: g });
    S.line(RX, RY, RX + RW, RY, { stroke: C.line, width: 1, dash: "3 5", parent: g });
    S.text(RX - 6, RY + 4, "1", { size: 12, fill: C.dim, anchor: "end", parent: g });
    const bw = RW / 8;
    st.softU.forEach((u, i) => {
      const w = lerp(u, st.softS[i], t) * grow;
      S.rect(RX + i * bw + 6, RY + RH - w * RH, bw - 12, w * RH, { fill: C.yellow, opacity: 0.85, rx: 3, parent: g });
      if (step === 4) S.rect(RX + i * bw + 6, RY + RH - u * RH, bw - 12, u * RH, { stroke: C.red, width: 1.5, rx: 3, parent: g });
      S.text(RX + i * bw + bw / 2, RY + RH + 18, "k" + (i + 1), { size: 12, fill: C.dim, anchor: "middle", parent: g });
    });
    S.text(RX, RY + RH + 48, "avg largest weight: " + fmt(st.meanMaxU) + " unscaled → " + fmt(st.meanMaxS) + " scaled", { size: 13, fill: C.ink, parent: g });
    if (step === 4) S.text(RX, RY + RH + 70, "red outline = unscaled weights", { size: 12, fill: C.red, parent: g, opacity: p });
  }

  S.text(400, 430, "d_k = " + dk + (dk === 64 ? " (the paper's value)" : ""), { size: 14, fill: C.yellow, anchor: "middle" });
}
</script>
<script defer src="_player.js"></script>
</body>
