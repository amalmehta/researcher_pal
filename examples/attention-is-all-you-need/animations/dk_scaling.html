<script>
/* ============================ EDIT BELOW ============================ */

const CONFIG = {
  title: "Why divide by √d_k?",
  source: "Attention Is All You Need · §3.2.1, last paragraph and footnote 4",
  equation: String.raw`\mathrm{Var}[q \cdot k] = \sum_{i=1}^{d_k} \mathrm{Var}[q_i k_i] = d_k \;\;\Rightarrow\;\; \mathrm{Var}\!\left[\frac{q \cdot k}{\sqrt{d_k}}\right] = 1`,
  notes: [
    "The paper says \"we suspect\": this is a hypothesis backed by one experiment [3], not a proof.",
    "Real queries and keys are learned, not random. What matters is how the spread grows with $d_k$.",
    "Try $d_k = 1$: scaling barely matters. Try 512: without it the weights are essentially one-hot.",
  ],
};

const PARAMS = [
  { id: "logdk", label: "log₂ d_k", min: 0, max: 9, step: 1, value: 6, paperValue: 6,
    help: "d_k = 2^value, from 1 to 512. The paper uses d_k = 64 (value 6)." },
];

const STEPS = [
  { caption: "Draw a random query $q$ and key $k$ whose $d_k$ components have mean 0 and variance 1, the assumption in footnote 4.", duration: 3.5 },
  { caption: "Their dot product adds up $d_k$ independent terms, so its variance is $d_k$ and its spread grows like $\\sqrt{d_k}$. Slide $d_k$ and watch the histogram widen.", duration: 4 },
  { caption: "Score one query against 8 keys and apply the softmax. With scores this spread out, most of the weight usually lands on a single key.", duration: 3.5 },
  { caption: "Divide the scores by $\\sqrt{d_k}$. The axis zooms in 10×: the spread is back to about 1 at every dimension, and the weights stay spread out.", duration: 4 },
  { caption: "Why it matters for learning: the softmax gradient $s_i(\\delta_{ij} - s_j)$ vanishes when one weight is near 1. Unscaled, gradients shrink as $d_k$ grows; scaled, they hold steady.", duration: 4.5 },
];

const DK_CACHE = {};
// Seeded simulation for one d_k: 600 random dot products, plus 100 "one query vs 8 keys" rows.
function dkStats(dk) {
  if (DK_CACHE[dk]) return DK_CACHE[dk];
  let seed = 7 + dk * 131;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const gauss = () => { let u = 0; while (u === 0) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
  const vec = () => Array.from({ length: dk }, gauss);
  const dot = (x, y) => x.reduce((s, xi, i) => s + xi * y[i], 0);
  const softmax = z => { const m = Math.max(...z); const e = z.map(v => Math.exp(v - m)); const t = e.reduce((s, x) => s + x, 0); return e.map(x => x / t); };
  const jacobianNorm = s => { let f = 0; s.forEach((si, i) => s.forEach((sj, j) => { const v = (i === j ? si : 0) - si * sj; f += v * v; })); return Math.sqrt(f); };
  const mean = xs => xs.reduce((s, x) => s + x, 0) / xs.length;

  const dots = [];
  for (let s = 0; s < 600; s++) dots.push(dot(vec(), vec()));
  const rows = [];
  for (let s = 0; s < 100; s++) { const q = vec(); rows.push(Array.from({ length: 8 }, () => dot(q, vec()))); }
  const maxU = rows.map(z => Math.max(...softmax(z)));
  const maxS = rows.map(z => Math.max(...softmax(z.map(v => v / Math.sqrt(dk)))));
  const meanMaxU = mean(maxU);
  // Show a typical row: the one whose largest unscaled weight is closest to the average.
  let pick = 0;
  maxU.forEach((v, i) => { if (Math.abs(v - meanMaxU) < Math.abs(maxU[pick] - meanMaxU)) pick = i; });
  const example = rows[pick];
  return (DK_CACHE[dk] = {
    dots,
    std: Math.sqrt(mean(dots.map(d => d * d))),
    q: Array.from({ length: Math.min(dk, 32) }, gauss),
    k: Array.from({ length: Math.min(dk, 32) }, gauss),
    softU: softmax(example),
    softS: softmax(example.map(v => v / Math.sqrt(dk))),
    meanMaxU,
    meanMaxS: mean(maxS),
    gradU: mean(rows.map(z => jacobianNorm(softmax(z)))),
    gradS: mean(rows.map(z => jacobianNorm(softmax(z.map(v => v / Math.sqrt(dk)))))),
  });
}

function draw({ S, C, step, p, params, lerp, during, fmt }) {
  const dk = 2 ** params.logdk, sq = Math.sqrt(dk);
  const st = dkStats(dk);
  const LX = 50, LW = 330, LY = 90, LH = 220;
  const RX = 440, RW = 320, RY = 90, RH = 220;

  // ---- Step 0: the components of q and k
  if (step === 0) {
    const g = S.group({ opacity: during(p, 0, 0.3) });
    S.text(LX, 80, "q and k: the first " + Math.min(dk, 32) + " of d_k = " + dk + " components (blue > 0, red < 0)", { size: 14, fill: C.dim, parent: g });
    [["q", st.q, C.yellow, 130], ["k", st.k, C.blue, 190]].forEach(([name, vals, color, y]) => {
      S.text(LX, y + 15, name, { size: 20, fill: color, weight: 600, parent: g });
      vals.forEach((v, i) => {
        const shown = during(p, 0.1 + (i / 32) * 0.55, 0.2 + (i / 32) * 0.55);
        S.rect(LX + 26 + i * 22, y, 19, 19, { fill: v >= 0 ? C.blue : C.red, opacity: shown * Math.min(1, 0.2 + Math.abs(v) / 2), rx: 3, parent: g });
      });
    });
    S.text(LX, 275, "q · k = q₁k₁ + q₂k₂ + … (d_k terms, each with mean 0 and variance 1)", { size: 18, parent: g, opacity: during(p, 0.65, 1) });
  }

  // ---- Left panel, steps 1–4: histogram of dot products (the axis zooms in as the values shrink)
  if (step >= 1) {
    const opacity = step === 1 ? during(p, 0, 0.3) : step === 4 ? 1 - p : 1;
    const g = S.group({ opacity });
    const t = step === 3 ? p : step === 4 ? 1 : 0;
    const XR = lerp(50, 5, t);
    const hx = v => LX + ((v + XR) / (2 * XR)) * LW;
    const values = st.dots.map(d => lerp(d, d / sq, t));
    const bins = new Array(50).fill(0);
    values.forEach(v => { const b = Math.floor(((v + XR) / (2 * XR)) * 50); if (b >= 0 && b < 50) bins[b]++; });
    const top = Math.max(...bins) || 1, bw = LW / 50;
    S.text(LX + LW / 2, 70, t < 0.5 ? "q · k for 600 random pairs" : "q · k / √d_k for the same pairs", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    bins.forEach((c, b) => S.rect(LX + b * bw + 0.5, LY + LH - (c / top) * LH, bw - 1, (c / top) * LH, { fill: C.blue, opacity: 0.85, parent: g }));
    S.line(LX, LY + LH, LX + LW, LY + LH, { stroke: C.dim, width: 1, parent: g });
    [-0.8, -0.4, 0, 0.4, 0.8].forEach(f => {
      const v = f * XR;
      S.text(hx(v), LY + LH + 18, Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1), { size: 12, fill: C.dim, anchor: "middle", parent: g });
    });
    const m = lerp(sq, 1, t);
    if (m < XR) {
      [-m, m].forEach(v => S.line(hx(v), LY, hx(v), LY + LH, { stroke: C.yellow, width: 1.5, dash: "4 4", parent: g }));
      S.text(hx(m) + 4, LY + 12, t < 0.5 ? "±√d_k" : "±1", { size: 12, fill: C.yellow, parent: g });
    }
    const measured = t < 0.5 ? st.std : st.std / sq;
    S.text(LX, LY + LH + 48, "spread (std): expected " + (t < 0.5 ? fmt(sq) : "1.00") + ", measured " + fmt(measured), { size: 13, fill: C.ink, parent: g });
  }

  // ---- Left panel, step 4: gradient size vs d_k
  if (step === 4) {
    const g = S.group({ opacity: p });
    const all = Array.from({ length: 10 }, (_, e) => dkStats(2 ** e));
    const top = Math.max(...all.map(s => Math.max(s.gradU, s.gradS))) * 1.15;
    const cx = e => LX + (e / 9) * LW, cy = v => LY + LH - (v / top) * LH;
    S.text(LX + LW / 2, 70, "average softmax gradient size vs d_k", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    S.line(LX, LY + LH, LX + LW, LY + LH, { stroke: C.dim, width: 1, parent: g });
    [0, 3, 6, 9].forEach(e => S.text(cx(e), LY + LH + 18, "d_k=" + 2 ** e, { size: 12, fill: C.dim, anchor: "middle", parent: g }));
    S.polyline(all.map((s, e) => [cx(e), cy(s.gradU)]), { stroke: C.red, width: 3, parent: g });
    S.polyline(all.map((s, e) => [cx(e), cy(s.gradS)]), { stroke: C.green, width: 3, parent: g });
    S.line(cx(params.logdk), LY, cx(params.logdk), LY + LH, { stroke: C.yellow, width: 1.5, dash: "4 4", parent: g });
    S.text(LX + LW, cy(all[9].gradS) - 10, "scaled", { size: 13, fill: C.green, anchor: "end", parent: g });
    S.text(LX + LW, cy(all[9].gradU) - 10, "unscaled", { size: 13, fill: C.red, anchor: "end", parent: g });
    S.text(LX, LY + LH + 48, "at d_k = " + dk + ": unscaled " + fmt(st.gradU, 3) + " vs scaled " + fmt(st.gradS, 3), { size: 13, fill: C.ink, parent: g });
  }

  // ---- Right panel, steps 2–4: softmax over 8 keys for a typical query
  if (step >= 2) {
    const g = S.group({ opacity: step === 2 ? during(p, 0, 0.3) : 1 });
    const t = step === 2 ? 0 : step === 3 ? p : 1;
    const grow = step === 2 ? during(p, 0.2, 1) : 1;
    S.text(RX + RW / 2, 70, t < 0.5 ? "softmax(scores): a typical query, 8 keys" : "softmax(scores / √d_k)", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    S.line(RX, RY + RH, RX + RW, RY + RH, { stroke: C.dim, width: 1, parent: g });
    S.line(RX, RY, RX + RW, RY, { stroke: C.line, width: 1, dash: "3 5", parent: g });
    S.text(RX - 6, RY + 4, "1", { size: 12, fill: C.dim, anchor: "end", parent: g });
    const bw = RW / 8;
    st.softU.forEach((u, i) => {
      const w = lerp(u, st.softS[i], t) * grow;
      S.rect(RX + i * bw + 6, RY + RH - w * RH, bw - 12, w * RH, { fill: C.yellow, opacity: 0.85, rx: 3, parent: g });
      if (step === 4) S.rect(RX + i * bw + 6, RY + RH - u * RH, bw - 12, u * RH, { stroke: C.red, width: 1.5, rx: 3, parent: g });
      S.text(RX + i * bw + bw / 2, RY + RH + 18, "k" + (i + 1), { size: 12, fill: C.dim, anchor: "middle", parent: g });
    });
    S.text(RX, RY + RH + 48, "avg largest weight: " + fmt(st.meanMaxU) + " unscaled → " + fmt(st.meanMaxS) + " scaled", { size: 13, fill: C.ink, parent: g });
    if (step === 4) S.text(RX, RY + RH + 70, "red outline = unscaled weights", { size: 12, fill: C.red, parent: g, opacity: p });
  }

  S.text(400, 430, "d_k = " + dk + (dk === 64 ? " (the paper's value)" : ""), { size: 14, fill: C.yellow, anchor: "middle" });
}

/* ============================ EDIT ABOVE ============================ */


// ---------------------------------------------------------------- palette & math utils
const C = { bg: "#000000", ink: "#ece8df", dim: "#9aa1a9", line: "#2a2f37", blue: "#58c4dd",
  yellow: "#f4d35e", green: "#83c167", red: "#fc6255", purple: "#c59bd8", orange: "#ff9f43", teal: "#5cd0b3" };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
// Progress of a sub-animation occupying fraction [a, b] of a step, e.g. during(p, 0.5, 1).
const during = (p, a, b) => clamp((p - a) / (b - a));
const fmt = (x, d = 2) => !Number.isFinite(x) ? "∞"
  : (Math.abs(x) >= 1e4 || (x !== 0 && Math.abs(x) < 1e-3)) ? x.toExponential(1) : x.toFixed(d);
function mix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return "#" + pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(t))).toString(16).padStart(2, "0")).join("");
}

// ---------------------------------------------------------------- drawing helpers
// Every helper takes an options object; pass { parent: S.group(...) } to nest.
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(node);
  return node;
}
const texCache = new Map();
function texHTML(src, display) {
  if (!window.katex) return src.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const key = (display ? "D" : "I") + src;
  if (!texCache.has(key)) texCache.set(key, katex.renderToString(src, { displayMode: display, throwOnError: false }));
  return texCache.get(key);
}
const S = {
  group: (o = {}) => el("g", { transform: o.transform, opacity: o.opacity }, o.parent),
  line: (x1, y1, x2, y2, o = {}) => el("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.width || 2,
    opacity: o.opacity, "stroke-dasharray": o.dash, "stroke-linecap": "round" }, o.parent),
  rect: (x, y, w, h, o = {}) => el("rect", { x, y, width: Math.max(0, w), height: Math.max(0, h), rx: o.rx, fill: o.fill || "none",
    stroke: o.stroke, "stroke-width": o.width, opacity: o.opacity }, o.parent),
  circle: (cx, cy, r, o = {}) => el("circle", { cx, cy, r: Math.max(0, r), fill: o.fill || "none", stroke: o.stroke,
    "stroke-width": o.width, opacity: o.opacity }, o.parent),
  path: (d, o = {}) => el("path", { d, fill: o.fill || "none", stroke: o.stroke || C.ink, "stroke-width": o.width || 2,
    opacity: o.opacity, "stroke-dasharray": o.dash, "stroke-linejoin": "round", "stroke-linecap": "round" }, o.parent),
  // Polyline through [[x, y], …], handy for plotting real functions.
  polyline: (pts, o = {}) => S.path(pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1)).join(""), o),
  text: (x, y, str, o = {}) => {
    const t = el("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 18, "text-anchor": o.anchor || "start",
      "font-weight": o.weight, opacity: o.opacity }, o.parent);
    t.textContent = str;
    return t;
  },
  arrow: (x1, y1, x2, y2, o = {}) => {
    const c = o.stroke || C.ink, hl = o.head || 10, a = Math.atan2(y2 - y1, x2 - x1);
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a), s = hl * 0.5;
    S.line(x1, y1, bx, by, Object.assign({}, o, { stroke: c }));
    return el("path", { d: `M${x2},${y2}L${bx + s * Math.sin(a)},${by - s * Math.cos(a)}L${bx - s * Math.sin(a)},${by + s * Math.cos(a)}Z`,
      fill: c, opacity: o.opacity }, o.parent);
  },
  // KaTeX inside the SVG. anchor: "start" | "middle" | "end"; y is the vertical center.
  tex: (x, y, src, o = {}) => {
    const size = o.size || 20, w = o.width || 360, h = size * 2.6;
    const left = o.anchor === "middle" ? x - w / 2 : o.anchor === "end" ? x - w : x;
    const fo = el("foreignObject", { x: left, y: y - h / 2, width: w, height: h, opacity: o.opacity }, o.parent);
    const div = document.createElement("div");
    div.style.cssText = `height:${h}px;display:flex;align-items:center;white-space:nowrap;color:${o.fill || C.ink};font-size:${size}px;` +
      `justify-content:${o.anchor === "middle" ? "center" : o.anchor === "end" ? "flex-end" : "flex-start"}`;
    div.innerHTML = texHTML(src, false);
    fo.appendChild(div);
    return fo;
  },
  // Matrix as a heatmap: M is an array of rows. Cell opacity ∝ (value - lo) / (hi - lo).
  matrix: (x, y, M, o = {}) => {
    const cell = o.cell || 32, flat = M.flat();
    const lo = o.lo ?? Math.min(...flat), hi = o.hi ?? Math.max(...flat);
    M.forEach((row, r) => row.forEach((v, c) => {
      S.rect(x + c * cell, y + r * cell, cell - 2, cell - 2, { fill: o.color || C.blue, rx: 3,
        opacity: 0.08 + 0.92 * clamp((v - lo) / ((hi - lo) || 1)), parent: o.parent });
      if (o.values) S.text(x + c * cell + cell / 2 - 1, y + r * cell + cell / 2 + 4, fmt(v, o.digits ?? 2),
        { size: o.fontSize || 11, anchor: "middle", fill: C.ink, parent: o.parent });
    }));
    (o.rowLabels || []).forEach((s, r) => S.text(x - 8, y + r * cell + cell / 2 + 5, s, { size: 13, anchor: "end", fill: C.dim, parent: o.parent }));
    (o.colLabels || []).forEach((s, c) => S.text(x + c * cell + cell / 2, y - 8, s, { size: 13, anchor: "middle", fill: C.dim, parent: o.parent }));
  },
};

// ---------------------------------------------------------------- player
const $ = id => document.getElementById(id);
const starts = [];
let total = 0;
for (const s of STEPS) { starts.push(total); total += s.duration; }
const params = {};
let t = 0, playing = false, last = null, stopAt = null, shownStep = -1;

function locate(time) {
  for (let k = 0; k < STEPS.length; k++) {
    if (time <= starts[k] + STEPS[k].duration + 1e-9) return { i: k, raw: clamp((time - starts[k]) / STEPS[k].duration) };
  }
  return { i: STEPS.length - 1, raw: 1 };
}

function setRichText(node, text) {
  node.innerHTML = text.split("$").map((part, k) => k % 2 ? texHTML(part, false)
    : part.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))).join("");
}

function render() {
  const { i, raw } = locate(t);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  el("rect", { x: 0, y: 0, width: 800, height: 450, fill: C.bg });
  try {
    draw({ S, C, step: i, p: smooth(raw), raw, params, lerp, clamp, smooth, during, fmt, mix });
  } catch (err) {
    console.error(err);
    playing = false;
    S.text(400, 225, "draw() error: " + err.message, { fill: C.red, anchor: "middle", size: 16 });
  }
  if (i !== shownStep) { setRichText($("caption"), STEPS[i].caption); shownStep = i; }
  $("scrub").value = String(Math.round((t / total) * 1000));
  $("counter").textContent = `Step ${i + 1} / ${STEPS.length}`;
  $("play").textContent = playing ? "⏸" : "▶";
}

function tick(now) {
  if (playing) {
    if (last !== null) t = Math.min(total, t + (now - last) / 1000);
    last = now;
    const limit = stopAt === null ? total : stopAt;
    if (t >= limit) { t = limit; playing = false; stopAt = null; last = null; }
    render();
  }
  requestAnimationFrame(tick);
}

function togglePlay() {
  if (!playing && t >= total - 1e-6) t = 0;
  playing = !playing; stopAt = null; last = null;
  render();
}
// Next: play the rest of the current step (or the whole next one) and pause at its end.
function nextStep() {
  const { i, raw } = locate(t);
  const end = starts[i] + STEPS[i].duration;
  if (raw < 0.999) stopAt = end;
  else if (i + 1 < STEPS.length) stopAt = end + STEPS[i + 1].duration;
  else return;
  playing = true; last = null;
  render();
}
// Prev: jump back to the finished state of the previous step.
function prevStep() {
  const { i, raw } = locate(t);
  t = raw > 0.001 ? starts[i] : (i > 0 ? starts[i - 1] : 0);
  playing = false; stopAt = null; last = null;
  render();
}

function init() {
  document.title = CONFIG.title + " · researcher-pal";
  $("title").textContent = CONFIG.title;
  $("source").textContent = CONFIG.source;
  if (window.katex) katex.render(CONFIG.equation, $("equation"), { displayMode: true, throwOnError: false });
  else $("equation").textContent = CONFIG.equation;
  CONFIG.notes.forEach(n => { const li = document.createElement("li"); setRichText(li, n); $("notes").appendChild(li); });

  PARAMS.forEach(pm => {
    params[pm.id] = pm.value;
    const wrap = document.createElement("div");
    wrap.className = "param";
    wrap.innerHTML = `<label for="p-${pm.id}"><span></span><output id="o-${pm.id}"></output></label>` +
      `<input id="p-${pm.id}" type="range" min="${pm.min}" max="${pm.max}" step="${pm.step}" value="${pm.value}"><small></small>`;
    setRichText(wrap.querySelector("span"), pm.label);
    wrap.querySelector("small").textContent = pm.help || "";
    const input = wrap.querySelector("input"), out = wrap.querySelector("output");
    const update = v => { params[pm.id] = Number(v); out.textContent = String(v); render(); };
    input.addEventListener("input", () => update(input.value));
    if (pm.paperValue !== undefined && pm.paperValue !== null) {
      const reset = document.createElement("button");
      reset.type = "button";
      reset.textContent = `reset to paper value (${pm.paperValue})`;
      reset.addEventListener("click", () => { input.value = pm.paperValue; update(pm.paperValue); });
      wrap.appendChild(reset);
    }
    out.textContent = String(pm.value);
    $("params").appendChild(wrap);
  });
  if (!PARAMS.length) $("params").closest(".card").hidden = true;

  const onClick = (id, fn) => $(id).addEventListener("click", e => { fn(); e.currentTarget.blur(); });
  onClick("play", togglePlay);
  onClick("next", nextStep);
  onClick("prev", prevStep);
  $("scrub").addEventListener("input", () => {
    t = (Number($("scrub").value) / 1000) * total; playing = false; stopAt = null; last = null; render();
  });
  document.addEventListener("keydown", e => {
    if (e.target instanceof HTMLInputElement) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); nextStep(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); }
  });

  render();
  requestAnimationFrame(tick);
}
// Deferred KaTeX has executed by DOMContentLoaded; if it failed to load, TeX shows as source.
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
