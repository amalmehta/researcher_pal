<title>Sinusoidal positional encoding · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "Sinusoidal positional encoding",
  source: "Attention Is All You Need · §3.5",
  equation: String.raw`PE_{(pos,\,2i)} = \sin\!\left(\frac{pos}{10000^{2i/d_{model}}}\right),\quad PE_{(pos,\,2i+1)} = \cos\!\left(\frac{pos}{10000^{2i/d_{model}}}\right)`,
  notes: [
    "Encodings are added to the token embeddings, not concatenated.",
    "The rotation picture is our derivation from $\\sin(a+b)$ and $\\cos(a+b)$; the paper only states that $PE_{pos+k}$ is a linear function of $PE_{pos}$.",
    "The paper interleaves sin and cos (even and odd dimensions); tensor2tensor concatenates them.",
  ],
};

const PARAMS = [
  { id: "pos", label: "Position pos", min: 0, max: 99, step: 1, value: 10, help: "Which token position to inspect." },
  { id: "k", label: "Offset k", min: 1, max: 40, step: 1, value: 5, help: "Distance to a second position, pos + k." },
  { id: "logd", label: "log₂ d_model", min: 4, max: 9, step: 1, value: 9, paperValue: 9, help: "d_model = 2^value. The paper uses 512 (value 9)." },
];

const STEPS = [
  { caption: "Each pair of dimensions $(2i, 2i{+}1)$ is a sine and cosine wave across positions. Small $i$ oscillates fast; large $i$ slowly, up to wavelength $10000 \\cdot 2\\pi$.", duration: 4.5 },
  { caption: "Stack the waves side by side, one row per position and one column per dimension. This fixed table is added to the token embeddings.", duration: 3 },
  { caption: "One position's row is its fingerprint. Neighbors agree on the slow dimensions and differ on the fast ones. Drag pos.", duration: 3.5 },
  { caption: "Moving $k$ positions rotates every (sin, cos) pair by the angle $k\\,\\omega_i$. The angle depends on $k$, not on pos, so relative offsets are easy to learn (§3.5).", duration: 4.5 },
  { caption: "So the similarity $PE_{pos} \\cdot PE_{pos+k}$ depends only on the offset $k$, and it falls off with distance. Change pos: the curve doesn't move.", duration: 4 },
];

const PE_CACHE = {};
function omega(i, d) { return 1 / Math.pow(10000, (2 * i) / d); }
function peValue(pos, dim, d) {
  const w = omega(Math.floor(dim / 2), d);
  return dim % 2 === 0 ? Math.sin(pos * w) : Math.cos(pos * w);
}
// Heatmap of the first min(d, 128) dimensions for positions 0..99, as a cached PNG data URL.
function peImage(d) {
  if (PE_CACHE[d]) return PE_CACHE[d];
  const cols = Math.min(d, 128), rows = 100;
  const canvas = document.createElement("canvas");
  canvas.width = cols; canvas.height = rows;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(cols, rows);
  for (let pos = 0; pos < rows; pos++) {
    for (let c = 0; c < cols; c++) {
      const v = peValue(pos, c, d), a = Math.abs(v), rgb = v >= 0 ? [88, 196, 221] : [252, 98, 85];
      const idx = (pos * cols + c) * 4;
      img.data[idx] = rgb[0] * a; img.data[idx + 1] = rgb[1] * a; img.data[idx + 2] = rgb[2] * a; img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return (PE_CACHE[d] = canvas.toDataURL());
}

function draw({ S, C, step, p, params, during, fmt }) {
  const d = 2 ** params.logd, pos = params.pos, k = params.k;
  const fade = during(p, 0, 0.25);

  // ---- Step 0: individual waves
  if (step === 0) {
    const picks = [0, d / 16, d / 8, d / 4].map(Math.floor);
    const colors = [C.blue, C.green, C.purple, C.orange];
    const x0 = 100, x1 = 740, px = t => x0 + (t / 99) * (x1 - x0);
    S.line(px(pos), 70, px(pos), 405, { stroke: C.yellow, width: 1.5, dash: "4 4" });
    S.text(px(pos), 62, "pos = " + pos, { size: 13, fill: C.yellow, anchor: "middle" });
    picks.forEach((i, r) => {
      const cy = 110 + r * 85, amp = 30, w = omega(i, d), lambda = (2 * Math.PI) / w;
      const reveal = during(p, 0.05 + r * 0.15, 0.4 + r * 0.15);
      S.line(x0, cy, x1, cy, { stroke: C.line, width: 1 });
      const pts = [];
      for (let t = 0; t <= 99 * reveal; t += 0.5) pts.push([px(t), cy - amp * Math.sin(t * w)]);
      if (pts.length > 1) S.polyline(pts, { stroke: colors[r], width: 2.5 });
      S.text(x0 - 12, cy - 3, "i = " + i, { size: 13, fill: colors[r], anchor: "end" });
      S.text(x0 - 12, cy + 14, "λ ≈ " + (lambda < 10000 ? lambda.toFixed(0) : lambda.toExponential(1)), { size: 11, fill: C.dim, anchor: "end" });
      if (99 * reveal >= pos) S.circle(px(pos), cy - amp * Math.sin(pos * w), 5, { fill: C.yellow });
    });
    S.text((x0 + x1) / 2, 432, "position → (sine dimension 2i shown for four values of i, d_model = " + d + ")", { size: 13, fill: C.dim, anchor: "middle" });
  }

  // ---- Steps 1–2: the whole table, then one row
  if (step === 1 || step === 2) {
    const cols = Math.min(d, 128), hx = 60, hy = 80, hw = 400, hh = 320;
    const g = S.group({ opacity: step === 1 ? fade : 1 });
    el("image", { href: peImage(d), x: hx, y: hy, width: hw, height: hh, preserveAspectRatio: "none", style: "image-rendering: pixelated" }, g);
    S.text(hx, hy - 12, "PE table: 100 positions × " + (cols === d ? "all " + d : "first " + cols + " of " + d) + " dimensions", { size: 13, fill: C.dim, parent: g });
    S.text(hx + hw / 2, hy + hh + 20, "dimension →", { size: 12, fill: C.dim, anchor: "middle", parent: g });
    S.text(hx - 8, hy + 10, "0", { size: 11, fill: C.dim, anchor: "end", parent: g });
    S.text(hx - 8, hy + hh, "99", { size: 11, fill: C.dim, anchor: "end", parent: g });
    S.text(hx - 8, hy + hh / 2, "pos", { size: 11, fill: C.dim, anchor: "end", parent: g });
    if (step === 2) {
      S.rect(hx - 2, hy + (pos / 100) * hh - 1, hw + 4, hh / 100 + 2, { stroke: C.yellow, width: 2 });
      const pairs = Array.from({ length: 8 }, (_, j) => Math.floor((j * d) / 16));
      const bx = 510, by = 240, bw = 15, grow = during(p, 0, 0.6);
      S.text(bx, 92, "PE[" + pos + "]: 8 (sin, cos) pairs across the dimensions", { size: 14, fill: C.yellow });
      S.line(bx, by, bx + 16 * bw, by, { stroke: C.dim, width: 1 });
      pairs.forEach((i, j) => {
        [2 * i, 2 * i + 1].forEach((dim, s) => {
          const v = peValue(pos, dim, d) * grow;
          S.rect(bx + (2 * j + s) * bw + 1, v >= 0 ? by - v * 110 : by, bw - 2, Math.abs(v) * 110, { fill: v >= 0 ? C.blue : C.red, opacity: s === 0 ? 0.95 : 0.6 });
        });
        S.text(bx + (2 * j + 1) * bw, by + 128, String(i), { size: 10, fill: C.dim, anchor: "middle" });
      });
      S.text(bx, by + 150, "i →  (solid = sin, faded = cos)", { size: 12, fill: C.dim });
      S.text(bx, by + 175, "Small i changes every step; large i barely moves.", { size: 13, fill: C.ink });
    }
  }

  // ---- Step 3: an offset is a rotation of each (sin, cos) pair
  if (step === 3) {
    const picks = [0, Math.floor(d / 32), Math.floor(d / 16)];
    picks.forEach((i, c) => {
      const cx = 150 + c * 250, cy = 215, r = 85, w = omega(i, d);
      const g = S.group({ opacity: fade });
      const P = ang => [cx + r * Math.sin(ang), cy - r * Math.cos(ang)];
      const a1 = pos * w, a2 = (pos + k) * w, sweep = during(p, 0.25, 0.9);
      S.circle(cx, cy, r, { stroke: C.line, width: 1.5, parent: g });
      S.text(cx + r + 6, cy + 4, "sin", { size: 11, fill: C.dim, parent: g });
      S.text(cx + 4, cy - r - 4, "cos", { size: 11, fill: C.dim, parent: g });
      const samples = Math.max(40, Math.ceil(Math.abs(a2 - a1) * 12));
      const arc = [];
      for (let s = 0; s <= samples; s++) arc.push(P(a1 + (a2 - a1) * sweep * (s / samples)));
      if (sweep > 0) S.polyline(arc, { stroke: C.orange, width: 3, parent: g });
      const [xa, ya] = P(a1), [xb, yb] = P(a1 + (a2 - a1) * sweep);
      S.line(cx, cy, xa, ya, { stroke: C.yellow, width: 2, parent: g });
      S.circle(xa, ya, 6, { fill: C.yellow, parent: g });
      if (sweep > 0) { S.line(cx, cy, xb, yb, { stroke: C.orange, width: 2, parent: g }); S.circle(xb, yb, 6, { fill: C.orange, parent: g }); }
      S.text(cx, cy - r - 24, "pair i = " + i, { size: 14, anchor: "middle", parent: g });
      S.text(cx, cy + r + 28, "rotation k·ω = " + ((k * w) % (2 * Math.PI)).toFixed(2) + " rad", { size: 13, fill: C.orange, anchor: "middle", parent: g });
    });
    S.text(400, 395, "yellow = (sin, cos) at pos = " + pos + "   ·   orange = at pos + k = " + (pos + k), { size: 13, fill: C.dim, anchor: "middle" });
    S.text(400, 420, "Change pos: both points move, but the rotation angle stays the same.", { size: 13, fill: C.ink, anchor: "middle" });
  }

  // ---- Step 4: similarity depends only on the offset
  if (step === 4) {
    const g = S.group({ opacity: fade });
    const X0 = 90, X1 = 740, Y0 = 95, Y1 = 345;
    const sim = (a, b) => { let s = 0; for (let c = 0; c < d; c++) s += peValue(a, c, d) * peValue(b, c, d); return s / (d / 2); };
    const ks = Array.from({ length: 101 }, (_, j) => j - 50);
    const vals = ks.map(kk => sim(pos, pos + kk));
    const lo = Math.min(0, ...vals), hi = 1;
    const kx = kk => X0 + ((kk + 50) / 100) * (X1 - X0), vy = v => Y1 - ((v - lo) / (hi - lo)) * (Y1 - Y0);
    S.text(X0, 70, "similarity PE[pos] · PE[pos + k], normalized so k = 0 gives 1", { size: 14, fill: C.dim, parent: g });
    S.line(X0, vy(0), X1, vy(0), { stroke: C.line, width: 1, parent: g });
    const count = Math.max(2, Math.round(during(p, 0.1, 0.8) * 101));
    S.polyline(vals.slice(0, count).map((v, j) => [kx(ks[j]), vy(v)]), { stroke: C.blue, width: 3, parent: g });
    const vk = sim(pos, pos + k);
    S.circle(kx(k), vy(vk), 6, { fill: C.orange, parent: g });
    S.text(kx(k) + 10, vy(vk) - 10, "k = " + k + ": " + fmt(vk), { size: 13, fill: C.orange, parent: g });
    [-50, -25, 0, 25, 50].forEach(t => S.text(kx(t), Y1 + 22, String(t), { size: 12, fill: C.dim, anchor: "middle", parent: g }));
    S.text((X0 + X1) / 2, Y1 + 44, "offset k", { size: 13, fill: C.dim, anchor: "middle", parent: g });
    const other = (pos + 37) % 100;
    S.text(X1, 425, "check: at pos = " + other + ", k = " + k + " gives " + fmt(sim(other, other + k)), { size: 13, fill: C.ink, anchor: "end", parent: g, opacity: during(p, 0.7, 1) });
  }
}
</script>
<script defer src="_player.js"></script>
</body>
