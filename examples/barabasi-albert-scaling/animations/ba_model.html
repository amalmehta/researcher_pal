<title>Growth + preferential attachment · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "Growth + preferential attachment",
  source: "Barabási & Albert, Emergence of Scaling in Random Networks · ¶8–¶9 (E4, E5), Fig. 2A–B",
  equation: String.raw`\Pi(k_i) = \frac{k_i}{\sum_j k_j} \qquad\Longrightarrow\qquad P(k) = \frac{2m^2}{k^3}`,
  notes: [
    "Circles are placed by arrival order, so the oldest vertices sit in the middle.",
    "The simulation starts from a complete graph on $m_0 = \\max(m, 2)$ vertices. The paper doesn't say how the first vertices are connected.",
    "Log-log dots are log-binned: counts in bins of growing width, divided by the bin width.",
  ],
};

const PARAMS = [
  { id: "m", label: "m (edges per new vertex)", min: 1, max: 5, step: 1, value: 5, paperValue: 5, help: "Fig. 2A uses m₀ = m = 5." },
  { id: "uniform", label: "Attachment", min: 0, max: 1, step: 1, value: 0, paperValue: 0, help: "0 = preferential (the model), 1 = uniform (model A)." },
  { id: "seed", label: "Random run", min: 1, max: 9, step: 1, value: 1, help: "A different seed for the same model." },
];

const STEPS = [
  { caption: "Start with $m_0$ vertices. The paper doesn't say how they're connected; here they form a complete graph so no degree is zero.", duration: 3 },
  { caption: "A new vertex arrives with $m$ edges. It links to vertex $i$ with probability $\\Pi(k_i) = k_i / \\sum_j k_j$ (bars), picking $m$ different vertices.", duration: 4.5 },
  { caption: "Repeat. Vertices that got links early keep attracting more: circle size shows degree, and the ranked degrees grow a long tail.", duration: 5 },
  { caption: "Now count degrees in a network of 20,000 vertices. On log-log axes $P(k)$ lies along a line of slope $-3$: the paper's $P(k) = 2m^2/k^3$.", duration: 4 },
  { caption: "Model A (red) keeps growth but attaches uniformly. Its tail bends down and there are no hubs. Growth alone isn't enough; set Attachment to 1 to see the network.", duration: 4 },
];

const BA_CACHE = {};
function baRandom(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Grow for t steps from a complete graph on m0 = max(m, 2) vertices. Picking a uniformly random edge
// endpoint selects vertex i with probability k_i / Σ k_j, i.e. preferential attachment in O(1).
function baGrow(t, m, uniform, seed) {
  const key = [t, m, uniform, seed].join(",");
  if (BA_CACHE[key]) return BA_CACHE[key];
  const rand = baRandom(seed * 7919 + m * 31 + (uniform ? 1 : 0));
  const m0 = Math.max(m, 2), edges = [], ends = [], degree = new Array(m0 + t).fill(0);
  for (let a = 0; a < m0; a++) for (let b = a + 1; b < m0; b++) { edges.push([a, b]); ends.push(a, b); degree[a]++; degree[b]++; }
  for (let s = 0; s < t; s++) {
    const n = m0 + s, chosen = new Set();
    while (chosen.size < m) chosen.add(uniform ? Math.floor(rand() * n) : ends[Math.floor(rand() * ends.length)]);
    for (const target of chosen) { edges.push([n, target]); ends.push(n, target); degree[n]++; degree[target]++; }
  }
  return (BA_CACHE[key] = { m0, edges, degree });
}
function baLogHistogram(degree) {
  const N = degree.length;
  let kmax = 0;
  for (const k of degree) if (k > kmax) kmax = k;
  const pts = [];
  for (let lo = 1; lo <= kmax; lo = Math.ceil(lo * 1.6)) {
    const hi = Math.ceil(lo * 1.6);
    let c = 0;
    for (const k of degree) if (k >= lo && k < hi) c++;
    if (c > 0) pts.push([Math.sqrt(lo * Math.max(lo, hi - 1)), c / (N * (hi - lo))]);
  }
  return pts;
}

function draw({ S, C, step, p, params, lerp, during, fmt }) {
  const m = params.m, uniform = params.uniform === 1, seed = params.seed;
  const SHOW = 200;
  const net = baGrow(SHOW, m, uniform, seed);
  const m0 = net.m0;
  const CX = 215, CY = 245;
  const posOf = j => { const r = 13 * Math.sqrt(j + 0.6), a = j * 2.39996; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };

  // How many vertices are visible at this point of the story.
  const count = step === 0 ? m0 : step === 1 ? Math.min(12, m0 + 7) + (p > 0.35 ? 1 : 0) : step === 2 ? Math.round(lerp(Math.min(12, m0 + 7) + 1, m0 + SHOW, p)) : m0 + SHOW;
  const degNow = new Array(count).fill(0);
  const shown = net.edges.filter(([a, b]) => a < count && b < count);
  shown.forEach(([a, b]) => { degNow[a]++; degNow[b]++; });

  S.text(CX, 50, uniform ? "model A: uniform attachment" : "the model: preferential attachment", { size: 15, fill: uniform ? C.red : C.dim, anchor: "middle" });
  const newest = count - 1;
  const lastStep = step === 1 && p > 0.35;
  shown.forEach(([a, b]) => {
    const pa = posOf(a), pb = posOf(b);
    const isNew = lastStep && (a === newest || b === newest);
    S.line(pa[0], pa[1], pb[0], pb[1], { stroke: isNew ? C.yellow : "#4a5263", width: isNew ? 2 : 0.8, opacity: isNew ? during(p, 0.35, 0.7) : 0.75 });
  });
  const ranked = degNow.map((k, j) => [k, j]).sort((x, y) => y[0] - x[0]);
  const hubs = new Set(ranked.slice(0, 3).map(x => x[1]));
  for (let j = 0; j < count; j++) {
    const [x, y] = posOf(j);
    const fill = lastStep && j === newest ? C.yellow : hubs.has(j) && step >= 2 ? C.orange : uniform ? C.red : C.blue;
    S.circle(x, y, 2.2 + 1.4 * Math.sqrt(degNow[j]), { fill, opacity: step === 0 ? during(p, 0, 0.5) : 0.95 });
  }

  const PX = 470, PW = 300, PY = 80, PH = 270;
  if (step === 1) {
    // Attachment probabilities for the vertices present before the newcomer.
    const before = Math.min(12, m0 + 7);
    const k = degNow.slice(0, before).map((_, j) => net.edges.filter(([a, b]) => (a === j && b < before) || (b === j && a < before)).length);
    const total = k.reduce((s, x) => s + x, 0);
    const targets = new Set(net.edges.filter(([a]) => a === before).map(([, b]) => b));
    S.text(PX + PW / 2, 50, "Π(k_i) = k_i / Σ k_j before the new vertex arrives", { size: 14, fill: C.dim, anchor: "middle" });
    const bw = PW / before;
    k.forEach((ki, j) => {
      const h = (ki / total) * PH * 2.2 * during(p, 0, 0.3);
      const hit = p > 0.35 && targets.has(j);
      S.rect(PX + j * bw + 3, PY + PH - h, bw - 6, h, { fill: hit ? C.yellow : C.blue, opacity: 0.9, rx: 2 });
      S.text(PX + j * bw + bw / 2, PY + PH + 16, "v" + j, { size: 10, fill: C.dim, anchor: "middle" });
      S.text(PX + j * bw + bw / 2, PY + PH - h - 5, Math.round((100 * ki) / total) + "%", { size: 10, fill: C.ink, anchor: "middle" });
    });
    S.text(PX, PY + PH + 44, "yellow = the " + m + " vertices the newcomer linked to", { size: 13, fill: C.yellow, opacity: during(p, 0.4, 0.7) });
  }
  if (step === 2) {
    S.text(PX + PW / 2, 50, "degrees, largest first (" + count + " vertices)", { size: 14, fill: C.dim, anchor: "middle" });
    const top = ranked[0][0] || 1, bw = PW / ranked.length;
    ranked.forEach(([kk], r) => {
      const h = (kk / top) * PH;
      S.rect(PX + r * bw, PY + PH - h, Math.max(bw - 0.3, 0.6), h, { fill: r < 3 ? C.orange : uniform ? C.red : C.blue, opacity: 0.9 });
    });
    S.line(PX, PY + PH, PX + PW, PY + PH, { stroke: C.dim, width: 1 });
    S.text(PX, PY + PH + 22, "largest degree " + top + " · typical degree " + ranked[Math.floor(ranked.length / 2)][0], { size: 13, fill: C.ink });
  }
  if (step >= 3) {
    const lx = k => PX + (Math.log10(k) / 3.3) * PW, ly = P => PY + (-Math.log10(P) / 7) * PH;
    const g = S.group({ opacity: step === 3 ? during(p, 0, 0.25) : 1 });
    S.text(PX + PW / 2, 50, "P(k), 20,000 vertices, log-log", { size: 14, fill: C.dim, anchor: "middle", parent: g });
    S.line(PX, PY + PH, PX + PW, PY + PH, { stroke: C.dim, width: 1, parent: g });
    S.line(PX, PY, PX, PY + PH, { stroke: C.dim, width: 1, parent: g });
    [1, 10, 100, 1000].forEach(k => S.text(lx(k), PY + PH + 18, String(k), { size: 11, fill: C.dim, anchor: "middle", parent: g }));
    [1, 1e-2, 1e-4, 1e-6].forEach(P => S.text(PX - 6, ly(P) + 4, P === 1 ? "1" : "1e" + Math.log10(P), { size: 11, fill: C.dim, anchor: "end", parent: g }));
    S.text(PX + PW / 2, PY + PH + 38, "degree k", { size: 12, fill: C.dim, anchor: "middle", parent: g });
    // Paper's analytic result 2m²/k³.
    const ref = [];
    for (let k = m; k <= 2000; k *= 1.2) { const P = (2 * m * m) / (k * k * k); if (P > 1e-7) ref.push([lx(k), ly(P)]); }
    S.polyline(ref, { stroke: C.yellow, width: 1.5, dash: "6 5", parent: g });
    S.text(lx(40), ly((2 * m * m) / 64000) - 10, "2m²/k³", { size: 13, fill: C.yellow, parent: g });
    const ba = baLogHistogram(baGrow(20000, m, false, seed).degree).filter(([, P]) => P > 1e-7);
    const reveal = step === 3 ? during(p, 0.2, 0.9) : 1;
    ba.slice(0, Math.ceil(reveal * ba.length)).forEach(([k, P]) => S.circle(lx(k), ly(P), 4.5, { fill: C.blue, parent: g }));
    if (step === 4) {
      const a = baLogHistogram(baGrow(20000, m, true, seed).degree).filter(([, P]) => P > 1e-7);
      a.slice(0, Math.ceil(during(p, 0.1, 0.8) * a.length)).forEach(([k, P]) => S.circle(lx(k), ly(P), 4.5, { fill: C.red, parent: g }));
      S.text(PX + PW, PY + 14, "● preferential", { size: 12, fill: C.blue, anchor: "end", parent: g });
      S.text(PX + PW, PY + 32, "● uniform (model A)", { size: 12, fill: C.red, anchor: "end", parent: g });
    }
  }
}
</script>
<script defer src="_player.js"></script>
</body>
