<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rich get richer: from k_i(t) to γ = 3 · researcher-pal</title>
<link rel="stylesheet" href="_player.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
/* ===================== THIS ANIMATION =====================
   CONFIG, PARAMS and draw() are all this page defines; _player.js does everything else. */

const CONFIG = {
  title: "Rich get richer: from k_i(t) to γ = 3",
  source: "Barabási & Albert, Emergence of Scaling in Random Networks · ¶10 (E6–E8), Fig. 2C",
  equation: String.raw`\frac{\partial k_i}{\partial t} = \frac{k_i}{2t} \;\Rightarrow\; {\color{#f4d35e}k_i(t) = m\left(\tfrac{t}{t_i}\right)^{1/2}} \;\Rightarrow\; P(k_i < k) = P\!\left(t_i > \tfrac{m^2 t}{k^2}\right) \;\Rightarrow\; P(k) = \frac{2m^2}{k^3}`,
  notes: [
    "The simulation grows 5,000 steps from a complete graph on $m_0 = \\max(m, 2)$ vertices (not in paper).",
    "The prediction is mean-field: it describes the typical vertex of a given age, and real vertices scatter around it.",
    "Nothing here is fitted. Every yellow curve is the paper's formula with your $m$ and $t$.",
  ],
};

const PARAMS = [
  { id: "t1", label: "Arrival time t₁ (vertex A)", min: 1, max: 200, step: 1, value: 5, paperValue: 5, help: "Fig. 2C follows vertices added at t₁ = 5 and t₂ = 95." },
  { id: "t2", label: "Arrival time t₂ (vertex B)", min: 1, max: 2000, step: 1, value: 95, paperValue: 95, help: "" },
  { id: "m", label: "m (edges per new vertex)", min: 1, max: 5, step: 1, value: 5, paperValue: 5, help: "The exponent 1/2 doesn't depend on m." },
  { id: "k", label: "Degree threshold k", min: 5, max: 150, step: 1, value: 20, help: "Used in the last two steps." },
];

const STEPS = [
  { caption: "Follow two vertices as the network grows: A arrives at $t_1$, B at $t_2$. Both start with $m$ edges, and A has a head start.", duration: 4 },
  { caption: "The continuum prediction: $\\partial k_i/\\partial t = m\\,\\Pi(k_i) = k_i/2t$, so ${\\color{#f4d35e}k_i(t) = m(t/t_i)^{1/2}}$, a line of slope 1/2 on log-log axes (the dashed lines).", duration: 4 },
  { caption: "Every vertex at the end, degree against arrival time. Early arrivals are rich, and the curve $m(t/t_i)^{1/2}$ runs through the cloud.", duration: 3.5 },
  { caption: "Degree below $k$ means arriving after $t_i = m^2t/k^2$ (vertical line). Drag $k$ and compare the fraction of vertices to the right with the formula.", duration: 4 },
  { caption: "Arrival times are uniform, so $P(k_i < k) = 1 - m^2t/k^2(t + m_0)$. Measured (blue) matches predicted (yellow); differentiating in $k$ gives $P(k) = 2m^2/k^3$.", duration: 4.5 },
];

const GL_CACHE = {};
// Preferential growth for T steps; stores every vertex's degree at ~60 log-spaced checkpoints.
function growthRun(m) {
  if (GL_CACHE[m]) return GL_CACHE[m];
  let seed = 4242 + m;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const T = 5000, m0 = Math.max(m, 2), N = m0 + T;
  const degree = new Int32Array(N), ends = [];
  for (let a = 0; a < m0; a++) for (let b = a + 1; b < m0; b++) { ends.push(a, b); degree[a]++; degree[b]++; }
  const checkpoints = [...new Set(Array.from({ length: 60 }, (_, i) => Math.round(Math.pow(T, i / 59))))];
  const snapshots = [];
  let next = 0;
  for (let s = 1; s <= T; s++) {
    const n = m0 + s - 1, chosen = new Set();
    while (chosen.size < m) chosen.add(ends[Math.floor(rand() * ends.length)]);
    for (const target of chosen) { ends.push(n, target); degree[n]++; degree[target]++; }
    if (s === checkpoints[next]) { snapshots.push(degree.slice()); next++; }
  }
  return (GL_CACHE[m] = { T, m0, N, degree, checkpoints, snapshots, image: null });
}

function draw({ S, C, step, p, params, during, fmt }) {
  const m = params.m, run = growthRun(m), T = run.T, m0 = run.m0;
  const X0 = 100, X1 = 740, Y0 = 70, Y1 = 350;
  const lx = t => X0 + (Math.log10(t) / Math.log10(T)) * (X1 - X0);
  const ky = k => Y1 - (Math.log10(k) / 3) * (Y1 - Y0);
  const idx = ti => m0 + ti - 1; // vertex index of the vertex that arrived at step ti
  const t1 = Math.min(params.t1, T), t2 = Math.min(params.t2, T);

  const logAxes = (xLabel, yLabel) => {
    S.line(X0, Y1, X1, Y1, { stroke: C.dim, width: 1 });
    S.line(X0, Y0, X0, Y1, { stroke: C.dim, width: 1 });
    [1, 10, 100, 1000, 5000].forEach(t => S.text(lx(t), Y1 + 18, String(t), { size: 11, fill: C.dim, anchor: "middle" }));
    [1, 10, 100, 1000].forEach(k => S.text(X0 - 8, ky(k) + 4, String(k), { size: 11, fill: C.dim, anchor: "end" }));
    S.text((X0 + X1) / 2, Y1 + 40, xLabel, { size: 13, fill: C.dim, anchor: "middle" });
    S.text(X0 - 40, Y0 - 12, yLabel, { size: 13, fill: C.dim });
  };

  if (step <= 1) {
    logAxes("time t (vertices added)", "degree k");
    const reveal = step === 0 ? during(p, 0.1, 0.95) : 1;
    const tNow = Math.pow(T, reveal);
    [[t1, C.blue, "A"], [t2, C.green, "B"]].forEach(([ti, color, name]) => {
      const pts = [];
      run.checkpoints.forEach((cp, c) => { if (cp >= ti && cp <= tNow) pts.push([lx(cp), ky(Math.max(1, run.snapshots[c][idx(ti)]))]); });
      if (pts.length > 1) S.polyline(pts, { stroke: color, width: 3 });
      if (pts.length) { const last = pts[pts.length - 1]; S.circle(last[0], last[1], 5, { fill: color }); const right = last[0] > 600; S.text(last[0] + (right ? -10 : 8), last[1] - 10, name + " (t_i = " + ti + ")", { size: 13, fill: color, anchor: right ? "end" : "start" }); }
      if (step === 1) {
        const pred = [];
        for (let t = ti; t <= T; t *= 1.15) pred.push([lx(t), ky(m * Math.sqrt(t / ti))]);
        pred.push([lx(T), ky(m * Math.sqrt(T / ti))]);
        S.polyline(pred.slice(0, Math.max(2, Math.ceil(during(p, 0.1, 0.9) * pred.length))), { stroke: C.yellow, width: 2, dash: "6 5" });
      }
    });
    if (step === 1) {
      const kA = run.degree[idx(t1)], kB = run.degree[idx(t2)];
      S.text(X1, 425, "at t = 5000: A has " + kA + " (predicted " + fmt(m * Math.sqrt(T / t1), 0) + "), B has " + kB + " (predicted " + fmt(m * Math.sqrt(T / t2), 0) + ")", { size: 13, fill: C.ink, anchor: "end" });
    }
  }

  if (step >= 2) {
    logAxes("arrival time t_i", step === 4 ? "" : "final degree k_i");
    if (step <= 3) {
      if (!run.image) {
        const canvas = document.createElement("canvas");
        canvas.width = X1 - X0; canvas.height = Y1 - Y0;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "rgba(88, 196, 221, 0.35)";
        for (let ti = 1; ti <= T; ti++) {
          const k = run.degree[idx(ti)];
          ctx.fillRect(lx(ti) - X0 - 1, ky(k) - Y0 - 1, 2.2, 2.2);
        }
        run.image = canvas.toDataURL();
      }
      const g = S.group({ opacity: step === 2 ? during(p, 0, 0.4) : 1 });
      el("image", { href: run.image, x: X0, y: Y0, width: X1 - X0, height: Y1 - Y0 }, g);
      const curve = [];
      for (let ti = 1; ti <= T; ti *= 1.1) curve.push([lx(ti), ky(m * Math.sqrt(T / ti))]);
      curve.push([lx(T), ky(m)]);
      S.polyline(curve, { stroke: C.yellow, width: 3, opacity: step === 2 ? during(p, 0.4, 0.9) : 1 });
    }
    if (step === 3) {
      const k = params.k, tStar = (m * m * T) / (k * k);
      S.line(X0, ky(k), X1, ky(k), { stroke: C.orange, width: 1.5, dash: "4 4" });
      S.text(X0 + 6, ky(k) - 6, "k = " + k, { size: 12, fill: C.orange });
      if (tStar >= 1 && tStar <= T) {
        S.rect(lx(tStar), Y0, X1 - lx(tStar), Y1 - Y0, { fill: C.orange, opacity: 0.08 * during(p, 0.2, 0.6) });
        S.line(lx(tStar), Y0, lx(tStar), Y1, { stroke: C.orange, width: 2 });
        S.text(lx(tStar) + 6, Y0 + 14, "t_i = m²t/k² = " + fmt(tStar, 0), { size: 12, fill: C.orange });
      }
      let below = 0;
      for (let j = 0; j < run.N; j++) if (run.degree[j] < k) below++;
      const predicted = 1 - (m * m * T) / (k * k * (T + m0));
      S.text(X1, 425, "fraction with degree < " + k + ": measured " + fmt(below / run.N, 3) + " · predicted " + fmt(Math.max(0, predicted), 3), { size: 13, fill: C.ink, anchor: "end" });
    }
    if (step === 4) {
      // Replace the scatter with the cumulative distribution P(k_i < k) as a function of k.
      S.rect(X0 + 1, Y0 - 20, X1 - X0, Y1 - Y0 + 60, { fill: C.bg });
      const kx = k => X0 + (Math.log10(k) / Math.log10(300)) * (X1 - X0), py = P => Y1 - P * (Y1 - Y0);
      S.line(X0, Y1, X1, Y1, { stroke: C.dim, width: 1 });
      [1, 3, 10, 30, 100, 300].forEach(k => S.text(kx(k), Y1 + 18, String(k), { size: 11, fill: C.dim, anchor: "middle" }));
      [0, 0.5, 1].forEach(P => S.text(X0 - 8, py(P) + 4, String(P), { size: 11, fill: C.dim, anchor: "end" }));
      S.text((X0 + X1) / 2, Y1 + 40, "degree threshold k", { size: 13, fill: C.dim, anchor: "middle" });
      S.text(X0 - 40, Y0 - 12, "P(k_i < k)", { size: 13, fill: C.dim });
      const sorted = Array.from(run.degree).sort((a, b) => a - b);
      const measured = [], predicted = [];
      for (let k = 1; k <= 300; k *= 1.05) {
        let lo = 0, hi = sorted.length;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] < k) lo = mid + 1; else hi = mid; }
        measured.push([kx(k), py(lo / sorted.length)]);
        if (k >= m) predicted.push([kx(k), py(Math.max(0, 1 - (m * m * T) / (k * k * (T + m0))))]);
      }
      const r = during(p, 0.1, 0.8);
      S.polyline(measured.slice(0, Math.max(2, Math.ceil(r * measured.length))), { stroke: C.blue, width: 3 });
      S.polyline(predicted.slice(0, Math.max(2, Math.ceil(r * predicted.length))), { stroke: C.yellow, width: 2, dash: "6 5" });
      const kk = params.k;
      let belowK = 0;
      for (let j = 0; j < run.N; j++) if (run.degree[j] < kk) belowK++;
      const predK = Math.max(0, 1 - (m * m * T) / (kk * kk * (T + m0)));
      S.line(kx(kk), Y0, kx(kk), Y1, { stroke: C.orange, width: 1.5, dash: "4 4" });
      S.circle(kx(kk), py(belowK / run.N), 5, { fill: C.blue });
      S.circle(kx(kk), py(predK), 5, { fill: C.yellow });
      S.text(kx(kk) + 8, Y1 - 10, "k = " + kk + ": measured " + fmt(belowK / run.N, 3) + ", predicted " + fmt(predK, 3), { size: 12, fill: C.orange });
      S.text(X1, Y0 + 30, "blue = simulation   ·   yellow = 1 − m²t / k²(t + m₀)", { size: 13, fill: C.ink, anchor: "end" });
      S.text(X1, 425, "slope of the density: d/dk of the yellow curve = 2m²t / (t + m₀) · k⁻³  →  γ = 3", { size: 13, fill: C.yellow, anchor: "end", opacity: during(p, 0.7, 1) });
    }
  }
}
</script>
<script defer src="_player.js"></script>
</body>
