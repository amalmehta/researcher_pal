name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    # Unit tests for the skills' scripts, the ideas reports, the site build and the NumPy exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml  # no requirements file; key the cache on this one
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils  # pdf_pages.py's Linux backend, so its tests run here too
          python -m pip install --upgrade pip pytest markdown numpy
      - name: Run checks
        env:
          PY: python
        run: bash tools/checks.sh --quick

  paper:
    # The expensive half: compile both venue PDFs and prove every figure and number still comes from the data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml  # no requirements file; key the cache on this one
      - name: Install figure tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz librsvg2-bin
          python -m pip install --upgrade pip pytest markdown numpy matplotlib
      - name: Install Tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: Compile the papers and check them against their data
        env:
          PY: python
        run: |
          set -e
          for venue in neurips2026 iclr2027; do
            dir="examples/paper-toy-transformer-ablation/paper/$venue"
            build="$RUNNER_TEMP/$venue"
            mkdir -p "$build"
            (cd "$dir" && tectonic -Z search-path=template main.tex --keep-logs --keep-intermediates --outdir "$build")
            python skills/paper-writer/scripts/check_paper.py "$dir" --build-dir "$build" \
              --page-limit 4 --anonymous --regenerate --no-figure-compare --python python
          done
      # The committed figures were built on macOS; Linux fonts, Graphviz and Cairo can't match them byte for
      # byte, so CI proves they still rebuild and that every value and table matches the data exactly.
      # Citation checks are deliberately not run here: they call free public APIs that rate-limit,
      # so a red build would mean "arXiv was busy", not "the paper is wrong". Run them locally.

  exercises:
    # PyTorch is a slow install, so the Attention exercises get their own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml  # no requirements file; key the cache on this one
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Reference solutions must pass, stubs must fail
        run: |
          python tools/run_example_tests.py examples/attention-is-all-you-need
          python tools/run_example_tests.py examples/attention-is-all-you-need --stubs
